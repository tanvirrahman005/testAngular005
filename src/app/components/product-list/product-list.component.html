<div class="container mt-4">
      <h2 class="text-primary mb-3">🛍 Product List</h2>

      <a routerLink="/products/add" class="btn btn-success mb-3">➕ Add Product</a>

      <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let p of products">
          <div class="card shadow-sm h-100">
            <img [src]="p.image" class="card-img-top" alt="{{ p.name }}" height="250px" width="200px"/>
            <div class="card-body">
              <h5 class="card-title">{{ p.name }}</h5>
              <p class="card-text text-muted">{{ p.category }}</p>
              <p class="fw-bold">৳{{ p.price }}</p>
              <a [routerLink]="['/products/details', p.id]" class="btn btn-outline-primary btn-sm">
                View Details
              </a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
              <a [routerLink]="['/products/edit', p.id]" class="btn btn-outline-primary btn-sm">
                Edit Data
              </a>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteProduct(p.id)">Delete</button>
            </div>
          </div>
        </div>
      </div>

      <hr />
      <!-- Child route outlet -->
      <!-- <router-outlet></router-outlet> -->
    </div>
